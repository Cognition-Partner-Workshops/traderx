plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'finos.traderx.trade-processor'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '10.1.61'
ext['jackson-bom.version'] = '2.21.8'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.18.0'

java{
	sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.h2database:h2:2.3.232'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	
	implementation('org.json:json:20260814') {
		because 'previous versions are affected by multiple CVE'
	}
	implementation ('io.socket:socket.io-client:2.1.0'){
		exclude group: 'org.json', module: 'json'
	}

	constraints {
		implementation('com.squareup.okhttp3:okhttp:4.12.0') {
			because 'Use patched HTTP client for Socket.IO'
		}
		implementation('com.squareup.okio:okio:3.18.2') {
			because 'Use patched IO implementation for Socket.IO'
		}
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
  useJUnitPlatform()
}
