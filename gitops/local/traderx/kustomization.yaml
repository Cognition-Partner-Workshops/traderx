apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traderx

resources:
 - namespace.yaml
 - ../../base/ingress
 - ../../base/database
 - ../../base/account-service
 - ../../base/people-service
 - ../../base/position-service
 - ../../base/reference-data
 - ../../base/trade-feed 
 - ../../base/trade-processor
 - ../../base/trade-service
 - ../../base/web-front-end 

# Shared TraderX auth material. Copy traderx-auth.env.example to traderx-auth.env
# (git-ignored) and fill in real values before applying.
secretGenerator:
  - name: traderx-auth
    envs:
      - traderx-auth.env
generatorOptions:
  disableNameSuffixHash: true
