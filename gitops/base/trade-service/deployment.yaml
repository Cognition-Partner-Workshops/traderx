apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: trade-service
  name: trade-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trade-service
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - env:
            - name: ACCOUNT_SERVICE_HOST
              value: account-service
            - name: DATABASE_TCP_HOST
              value: database
            - name: PEOPLE_SERVICE_HOST
              value: people-service
            - name: REFERENCE_DATA_HOST
              value: reference-data
            - name: TRADE_FEED_HOST
              value: trade-feed
          image: traderx/trade-service
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 18092
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18092
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18092
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          name: trade-service
          ports:
            - containerPort: 18092
              protocol: TCP
          workingDir: /trade-service
      restartPolicy: Always