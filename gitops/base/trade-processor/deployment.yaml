apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-processor-deployment
  labels:
    app: trade-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-processor
  template:
    metadata:
      labels:
        app: trade-processor
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
      - name: trade-processor-app
        image: traderx/trade-processor
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
        startupProbe:
          tcpSocket:
            port: 18091
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 18091
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 18091
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        ports:
        - containerPort: 18091
        env:
        - name: DATABASE_TCP_HOST
          value: database
        - name: TRADE_FEED_HOST
          value: trade-feed
