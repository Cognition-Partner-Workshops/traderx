apiVersion: v1
kind: Service
metadata:
  labels:
    app: people-service
  name: people-service
spec:
  ports:
    - name: "18089"
      port: 8080
      targetPort: 18089
    # Same-port alias: callers use http://people-service:18089 (see *_SERVICE_HOST / TRADE_FEED_HOST).
    - name: internal
      port: 18089
      targetPort: 18089
  selector:
    app: people-service
