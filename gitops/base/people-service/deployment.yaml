apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: people-service
  name: people-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: people-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: people-service
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: people-service
          image: traderx/people-service
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 18089
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18089
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18089
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 18089
              protocol: TCP
      restartPolicy: Always
