apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: trade-feed
  name: trade-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-feed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trade-feed
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - image: traderx/trade-feed
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 18086
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18086
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18086
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          name: trade-feed
          env:
            - name: TRADE_FEED_PORT
              value: "18086"
          ports:
            - containerPort: 18086
              protocol: TCP
          workingDir: /trade-feed
      restartPolicy: Always
