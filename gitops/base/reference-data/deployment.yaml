apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reference-data
  name: reference-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reference-data
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: reference-data
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: reference-data
          env:
            - name: REFERENCE_DATA_SERVICE_PORT
              value: "18085"
          image: traderx/reference-data
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 18085
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18085
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18085
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 18085
              protocol: TCP
          workingDir: /reference-data
      restartPolicy: Always
