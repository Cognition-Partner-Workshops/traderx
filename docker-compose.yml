version: '3.4'

# Only the ingress (8080) is published to the host. Every backend service and the
# database are reachable solely on the internal network, and every service validates
# TraderX bearer tokens signed with TRADERX_AUTH_SECRET (see .env.example).
x-auth-env: &auth-env
  TRADERX_AUTH_SECRET: ${TRADERX_AUTH_SECRET:?TRADERX_AUTH_SECRET must be set (>= 32 chars)}

services:
  database:
    restart: always
    environment:
      - DATABASE_WEB_HOSTNAMES=${TRADERX_FQDN:-localhost}
    image: database
    build:
      context: database
      dockerfile: Dockerfile
    working_dir: /database
    expose:
      - 18082
      - 18083
      - 18084
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: ./run.sh
    networks:
      - localnet
  reference-data:
    restart: always
    image: reference-data
    build:
      context: reference-data
      dockerfile: Dockerfile
    working_dir: /reference-data
    expose:
      - 18085
    environment:
      <<: *auth-env
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: npm run start
    networks:
      - localnet
  trade-feed:
    restart: always
    image: trade-feed
    build:
      context: trade-feed
      dockerfile: Dockerfile
    working_dir: /trade-feed
    expose:
      - 18086
    environment:
      <<: *auth-env
      ACCOUNT_SERVICE_URL: http://account-service:18088
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: npm run start
    networks:
      - localnet
  people-service:
    restart: always
    image: people-service
    build:
      context: people-service
      dockerfile: Dockerfile
    working_dir: /people-service
    expose:
      - 18089
    environment:
      <<: *auth-env
      TRADERX_DEMO_USER_PASSWORD: ${TRADERX_DEMO_USER_PASSWORD:?TRADERX_DEMO_USER_PASSWORD must be set}
      TRADERX_ADMIN_USERS: ${TRADERX_ADMIN_USERS:-}
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: /PeopleService.WebApi dotnet run
    networks:
      - localnet
  account-service:
    restart: always
    image: account-service
    build:
      context: account-service
      dockerfile: Dockerfile
    working_dir: /account-service
    expose:
      - 18088
    environment:
      <<: *auth-env
      DATABASE_TCP_HOST: database
      PEOPLE_SERVICE_HOST: people-service
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: ./gradlew bootRun
    networks:
      - localnet
    depends_on:
      - database
      - people-service
  position-service:
    restart: always
    image: position-service
    build:
      context: position-service
      dockerfile: Dockerfile
    working_dir: /position-service
    expose:
      - 18090
    environment:
      <<: *auth-env
      DATABASE_TCP_HOST: database
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: ./gradlew bootRun
    networks:
      - localnet
    depends_on:
      - database
  trade-service:
    restart: always
    image: trade-service
    build:
      context: trade-service
      dockerfile: Dockerfile
    working_dir: /trade-service
    expose:
      - 18092
    environment:
      <<: *auth-env
      DATABASE_TCP_HOST: database
      PEOPLE_SERVICE_HOST: people-service
      ACCOUNT_SERVICE_HOST: account-service
      REFERENCE_DATA_HOST: reference-data
      TRADE_FEED_HOST: trade-feed
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: ./gradlew bootRun
    networks:
      - localnet
    depends_on:
      - database
      - people-service
      - account-service
      - reference-data
      - trade-feed
  trade-processor:
    restart: always
    image: trade-processor
    build:
      context: trade-processor
      dockerfile: Dockerfile
    working_dir: /trade-processor
    expose:
      - 18091
    environment:
      <<: *auth-env
      DATABASE_TCP_HOST: database
      TRADE_FEED_HOST: trade-feed
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: ./gradlew bootRun
    networks:
      - localnet
    depends_on:
      - database
      - trade-feed
  web-front-end-angular:
    restart: always
    image: web-front-end-angular
    build:
      context: web-front-end/angular
      dockerfile: Dockerfile
    working_dir: /web-front-end/angular
    expose:
      - 18093
    volumes:
      # Mount the root folder that contains .git
      - .:/workspace:cached
    command: npm run start
    networks:
      - localnet
    depends_on:
      - database
      - trade-feed
  ingress:
    image: ingress
    build:
      context: ingress
      dockerfile: Dockerfile
      args:
        - NGINX_HOST=${TRADERX_FQDN:-localhost}
    working_dir: /ingress
    expose:
      - 8080
    ports:
      - 8080:8080
    networks:
      - localnet
    depends_on:
      - trade-feed
      - people-service
      - account-service
      - position-service
      - trade-service
      - web-front-end-angular

networks:
  localnet:
    driver: bridge
