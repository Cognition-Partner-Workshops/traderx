plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

dependencies {
   implementation 'com.h2database:h2:2.2.224'
}

application {
    // Define the main class for the application.
    mainClass = 'org.h2.tools.Console'
}

jar {
    manifest {
        attributes "Main-Class": "org.h2.tools.Console"
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
tasks.register('remoteAccessTest', Exec) {
    description = 'SSC-01: asserts the H2 web console and PG server are not exposed to remote clients.'
    group = 'verification'
    commandLine 'bash', 'src/test/sh/run_sh_remote_access_test.sh'
}

check.dependsOn remoteAccessTest

tasks.register('runtimeAccessTest', Exec) {
    description = 'SSC-01: starts the DB in Docker and checks auth and remote access at runtime (requires Docker).'
    group = 'verification'
    dependsOn jar
    commandLine 'bash', 'src/test/sh/run_sh_runtime_access_test.sh'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}