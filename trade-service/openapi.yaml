openapi: 3.0.1
info:
  title: FINOS TraderX Trade Service
  version: 0.1.0
servers:
  - url: ''
# Every operation requires a TraderX bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []
paths:
  /trade/:
    post:
      tags:
        - trade-order-controller
      operationId: createTradeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeOrder'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/TradeOrder'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: TraderX bearer token (HS256) obtained from people-service POST /Auth/Login
  schemas:
    TradeOrder:
      type: object
      properties:
        id:
          type: string
          example: 'ABC-123-XYZ'
        state:
          type: string
          example: 'New'
        security:
          type: string
          example: 'ADBE'
        quantity:
          type: integer
          format: int32
          example: 100
        accountID:
          type: integer
          format: int32
          example: 22214
        side:
          type: string
          enum:
            - Buy
            - Sell
