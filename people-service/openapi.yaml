openapi: 3.0.1
info:
  title: PeopleService.WebApi
  version: v1
# Every operation requires a TraderX bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []
paths:
  /Auth/Login:
    post:
      tags:
        - Auth
      summary: Exchange directory credentials for a TraderX bearer token (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logonId, password]
              properties:
                logonId:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresAt:
                    type: string
                    format: date-time
                  logonId:
                    type: string
                  fullName:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
        '401':
          description: Unknown user or wrong password
  /People/GetPerson:
    get:
      tags:
        - People
      summary: Get a person from directory by logon or employee ID
      parameters:
        - name: LogonId
          in: query
          schema:
            type: string
            nullable: true
        - name: EmployeeId
          in: query
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: The person with the specified identity was found
          content:
            "application/json":
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: The request was invalid
        '404':
          description: The person with the specified identity was not found
  /People/GetMatchingPeople:
    get:
      tags:
        - People
      summary: Get all the people from the directory whose logonId or full name contain the search text
      parameters:
        - name: SearchText
          in: query
          schema:
            type: string
            nullable: true
        - name: Take
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of People whose LogonId or FullName contain the search text
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '400':
          description: The request was invalid
        '404':
          description: People with the specified search text were not found
  /People/ValidatePerson:
    get:
      tags:
        - People
      summary: Validate a person against the firmwide directory without returning any attributes.
      parameters:
        - name: LogonId
          in: query
          schema:
            type: string
            nullable: true
        - name: EmployeeId
          in: query
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: The person with the specified identity was found
        '400':
          description: The request was invalid
        '404':
          description: The person with the specified identity was not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: TraderX bearer token (HS256) obtained from people-service POST /Auth/Login
  schemas:
    Person:
      type: object
      properties:
        logonId:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        employeeId:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
      additionalProperties: false
